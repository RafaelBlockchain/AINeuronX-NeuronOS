name: Golden Check N200
on:
  push:
    branches: [ main ]
                 
jobs:
  golden:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
    
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 iverilog yosys

      - name: Run RTL Compute Verification
        run: |
          iverilog -g2012 -Wall -o sim_compute \
            verification/compute/tb_tile_core_compute.sv \
            src/core_compute/Tile_Core_Compute.sv \
            src/core_compute/vector/vector_unit.sv \
            src/core_compute/tensor/systolic_ctrl.sv \
            src/core_compute/tensor/systolic_buffer.sv \
            src/core_compute/tensor/systolic_array.sv \
            src/core_compute/tensor/systolic_pe.sv
          vvp sim_compute

      - name: Run Yosys Synthesis Check (N200_Top 4x4x4)
        run: |
          yosys -q -p "
            read_verilog -sv -DSYNTHESIS \
              src/core_compute/N200_Top.sv \
              src/core_compute/Tile_Core_Compute.sv \
              src/core_compute/vector/vector_unit.sv \
              src/core_compute/tensor/systolic_ctrl.sv \
              src/core_compute/tensor/systolic_buffer.sv \
              src/core_compute/tensor/systolic_array.sv \
              src/core_compute/tensor/systolic_pe.sv;
            hierarchy -check -top N200_Top;
            proc; opt; fsm; opt; memory; opt;
            techmap; opt;
            check -assert;
            stat
          "
          
