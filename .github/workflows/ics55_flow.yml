name: AINeuronX N200 - ICS55 Physical Flow

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'openlane/**'
      - 'constraints/**'
      - '.github/workflows/ics55_flow.yml'
  workflow_dispatch:

jobs:
  rtl2gds-ics55:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AINeuronX-NeuronOS
        uses: actions/checkout@v4

      - name: Instalar ICsprout 55nm OpenPDK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone ckdur/icsprout55-openpdk $HOME/pdk_root -- --depth 1
          echo "PDK_ROOT=$HOME/pdk_root" >> $GITHUB_ENV
          echo "PDK=icsprout55" >> $GITHUB_ENV

      - name: Ejecutar flujo LibreLane (Síntesis + PnR + KLayout DRC)
        uses: fossi-foundation/librelane-action@v0.1
        with:
          working-directory: openlane
          arguments: --pdk icsprout55 --manual-pdk --run-tag ci_ics55 config.json

      - name: Subir artefactos GDSII y reportes PPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: N200_Top-ICS55-Results
          path: |
            openlane/runs/ci_ics55/final/gds/*.gds
            openlane/runs/ci_ics55/final/metrics.json
            openlane/runs/ci_ics55/logs/
            
