name: Build GDSII - IHP SG13G2 (130nm)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'openlane/**'
      - '.github/workflows/gds_ihp_sg13g2.yml'
                      
jobs:
  hardening-sg13g2:
    runs-on: ubuntu-latest
    container:
      image: hpretl/iic-osic-tools:latest
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run LibreLane RTL-to-GDSII (ihp-sg13g2)
        run: |
          export PATH=/foss/tools/bin:$PATH
          export PDK_ROOT=/foss/pdks
          export PDK=ihp-sg13g2
          librelane --pdk ihp-sg13g2 --run-tag aineuronx_8x8_75mhz openlane/config.json

      - name: Upload GDSII and Signoff Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AINeuronX-8x8-ihp-sg13g2-75MHz-GDS
          path: |
            openlane/runs/aineuronx_8x8_75mhz/final/
            openlane/runs/aineuronx_8x8_75mhz/54-klayout-streamout/
            openlane/runs/aineuronx_8x8_75mhz/logs/
            
